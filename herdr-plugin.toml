# Browse, install and update herdr plugins from a popup. The same binary is
# also a standalone command line; see README.md.

id = "vika2603.plugin-manager"
name = "Plugin Manager"
version = "0.3.1"
# The socket client is generated against herdr 0.9.1 (protocol 22).
min_herdr_version = "0.9.1"
description = "Browse, install and update herdr plugins"
platforms = ["linux", "macos", "windows"]

# Build the checked-out source first; use a verified release when Go is absent.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/install.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/build.ps1"]

[[actions]]
id = "open"
title = "Manage plugins"
description = "Open the plugin manager popup"
contexts = ["global", "workspace", "tab", "pane"]
command = ["./bin/hpm"]

[[panes]]
id = "manager"
title = "Plugins"
description = "Browse, install and update herdr plugins"
placement = "popup"
width = "80%"
height = "80%"
command = ["./bin/hpm"]
