name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build with the manifest command
        run: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/build.ps1
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: windows-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      # The build scripts use the manifest version for their release fallback.
      - name: Check the tag against the manifest version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
      - name: Build
        run: |
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            if [ "$os" = windows ]; then
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/hpm.exe ./cmd/hpm
              (cd dist && zip -q "hpm_${os}_${arch}.zip" hpm.exe)
              rm dist/hpm.exe
            else
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/hpm ./cmd/hpm
              tar -czf "dist/hpm_${os}_${arch}.tar.gz" -C dist hpm
              rm dist/hpm
            fi
          done
          (cd dist && sha256sum hpm_*) > dist/checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
